<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Job Application Helper</title>
</head>

<body>
    <header class="box-bg">
        <h2 class="heading center my-1">Job Application Helper</h2>
    </header>
    <section class="container-fluid">
        <div class="row">
            <div class="col-md-6 col-sm-12 border py-3">
                <h2 class="sub-heading center py-3">
                    Upload Resume
                </h2>
                <div class="file-upload box-shadow">
                    <div>
                        <input type="file" accept="application/pdf,.pdf class=" form-control" id="resume">
                    </div>
                </div>
                <p class="pdftext"></p>
            </div>
            <div class="col-md-6 col-sm-12 border">
                <h2 class="sub-heading center py-5">
                    Job Description
                </h2>
                <textarea name="desc" class="p-2 border job-desc" placeholder="Copy & Paste job description here."
                    id="desc"></textarea>
                <button class="btn btn-dark my-2" id="checkbtn">Check Now</button>
            </div>
        </div>
    </section>

    <br class="border">

    <section class="container-fluid">
        <h2 class="match_score sub-heading center p-3 box-bg my-2 br-7 box-shadow">
            Matching Score: 0%
        </h2>
        <div class="row">
            <div class="col-md-6 col-sm-6">
                <table class="border w-90 m-auto">
                    <thead>
                        <tr>
                            <th class="text-center">Matching Skills</th>
                        </tr>
                    </thead>
                    <tbody class="match-board">
                        <tr>
                            <td>Nothing to show yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="col-md-6 col-sm-6">
                <table class="border w-90 m-auto">
                    <thead>
                        <tr>
                            <th class="text-center">Missing Skills</th>
                        </tr>
                    </thead>
                    <tbody class="missing-board">
                        <tr>
                            <td>Nothing to show yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </section>

    <section class="container mt-4 mb-3">
        <h2 class="sub-heading center p-3 box-bg my-2 br-7 box-shadow">
            Ai Cover Letter
        </h2>
        <div class="coverletter border br-7">
            <div class="row">
                <i class="fa-regular fa-copy copy-icon"></i>

            </div>
            <div class="cover_letter">
                    <button id="gen_letter" class="btn btn-dark m-auto">Generate Now</button>
            </div>
        </div>
    </section>

    <footer>
        <p class="mb-0 text-center">Made with ♥ by Abdullah Hussain.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7Mq``````````````````````````````sXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"
        integrity="sha512-Z8CqofpIcnJN80feS2uccz+pXWgZzeKxDsDNMD/dJ6997/LSRY+W4NmEt9acwR+Gt9OHN0kkI1CTianCwoqcjQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js';
    </script>

    <script src="js/main.js"></script>
</body>

</html>
